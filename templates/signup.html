<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create account | Yobi1</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;color:#111}
.card{width:100%;max-width:420px;text-align:center}.logo{font-size:58px;font-weight:600;margin-bottom:36px}h1{font-size:28px;margin:0 0 10px}
p{color:#666;line-height:1.5;margin:0 0 26px}input{width:100%;padding:15px 16px;font-size:17px;border:1px solid #bbb;border-radius:13px;outline:none}
input:focus{border-color:#72dfe5}button{width:100%;margin-top:14px;padding:15px;border:0;border-radius:13px;background:#111;color:#fff;font-size:17px;font-weight:600}
.note{margin-top:20px;font-size:13px;color:#888}
</style>
</head>
<body>
<main class="card">
<div class="logo">Yobi1</div>
<h1>Create account</h1>
<p>Enter your email address to start creating your Yobi1 account.</p>
<form method="post" action="/signup">
<input type="email" name="email" placeholder="Email address" autocomplete="email" required>
<button type="submit">Continue</button>
</form>
<div class="note">A verification code will be sent to this email.</div>
</main>
</body></html>
